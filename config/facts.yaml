# Fact-type taxonomy — frozen before the full run (research doc, Table 2).
#
# H1 predicts these degrade at different rates. Adding or removing a category after
# the run starts turns a preregistered test into a fishing expedition.

version: 1
status: FROZEN

# `answer_hint` is appended to the prompt so the model returns only the value.
# Minimal per-type guidance — it must NOT reveal the finite answer set or offer
# multiple choice (open_decisions.md #7).
types:
  numerical:
    example: "Person_0's employee ID is 100000."
    importance: high
    answer_form: exact_string      # digits; matcher must not accept a near miss
    answer_hint: "Reply with only the ID number, digits only."
    h1_prediction: fast degradation — no semantic redundancy to reconstruct from

  temporal:
    example: "Person_0 arrived before Person_1."
    importance: medium
    answer_form: entity
    answer_hint: "Reply with only the name of the person who arrived first."
    h1_prediction: slower — binary orderings are guessable at 50% by chance
    caveat: >-
      Two-way question, chance 0.5. Candidate order in the question is balanced
      independently of the gold and of distractor_density
      (dataset.temporal `swap_candidates`, driven from generate_items). The earlier
      gold-always-first wording was solvable with zero reasoning or memory: the
      forced-baseline diagnostic scored target-removed forced accuracy at 100%
      (36/36 first-listed). Chance-correct before comparing this category against
      the others, and re-validate the repaired form before evidentiary use.

  entity-attribute:
    example: "Person_0's favorite color is blue."
    importance: medium
    answer_form: closed_set        # 5 colours -> 20% chance
    answer_hint: "Reply with only the colour."
    h1_prediction: fast degradation, but chance-corrected

  multi-hop:
    example: "Person_0 manages Person_1. Person_1 works for Google."
    query: which company does Person_0's subordinate work for?
    importance: high
    answer_form: closed_set        # 5 companies
    answer_hint: "Reply with only the company name."
    h1_prediction: fastest — requires two facts to survive compression, not one

  contradictory:
    example: "Person_0 lived in Paris. Person_0 now lives in London."
    importance: high
    answer_form: closed_set
    answer_hint: "Reply with only the name of the city where they live now."
    h1_prediction: the update should survive; the stale value is the failure mode
    caveat: >-
      The pilot scores this at 0% under every condition, including in-window,
      where every other type scores 100%. That pattern is a scoring bug, not
      degradation — the matcher is likely accepting the first location or
      rejecting a correct answer. See open_decisions.md #7.

# Chance accuracy per category, for chance-correcting H1 comparisons. Categories
# with different chance floors are not directly comparable on raw accuracy.
#
# OPEN DECISION (open_decisions.md #7 / #17): raw accuracy is the PRIMARY H1 metric.
# The 0.2 values below assume a uniform pick over a 5-item closed set, but entity-
# attribute / multi-hop / contradictory are free-response questions — the model is
# never shown the five options, and collision control removes the gold from the
# visible context, so the true uninformed baseline is unknown and probably < 0.2.
# `metrics.chance_corrected_accuracy` still uses these; treat its output as
# indicative only until the baseline is resolved (options A/B/C in the protocol).
chance:
  numerical: 0.0
  temporal: 0.5
  entity-attribute: 0.2      # PROVISIONAL — see note above
  multi-hop: 0.2             # PROVISIONAL
  contradictory: 0.2         # PROVISIONAL

# Distractors must never contain the target's answer, or a "correct" response can
# be produced without retrieving anything. Enforced by dataset.assert_no_collision.
collision_control:
  enabled: true
  check: target answer string must not appear in any distractor text
