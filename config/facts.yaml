# Fact-type taxonomy — frozen before the full run (research doc, Table 2).
#
# H1 predicts these degrade at different rates. Adding or removing a category after
# the run starts turns a preregistered test into a fishing expedition.

version: 1
status: FROZEN

# `answer_hint` is appended to the prompt so the model returns only the value.
# Minimal per-type guidance — it must NOT reveal the finite answer set or offer
# multiple choice (open_decisions.md #7).
#
# `construct` is the paper-facing display name (report.fact_type_label). The
# `fact_type` VALUE in the data / scorer / `chance` map stays as the key below.
types:
  numerical:
    construct: numerical ID
    example: "Person_0's employee ID is 100000."
    importance: high
    answer_form: exact_string      # digits; matcher must not accept a near miss
    answer_hint: "Reply with only the ID number, digits only."
    h1_prediction: fast degradation — no semantic redundancy to reconstruct from

  temporal:
    construct: temporal order
    example: "Person_0 arrived before Person_1."
    importance: medium
    answer_form: entity
    answer_hint: "Reply with only the name of the person who arrived first."
    h1_prediction: slower — binary orderings are guessable at 50% by chance
    caveat: >-
      Two-alternative forced choice, theoretical chance 0.5. Two nuisance factors
      — which identity arrived first / is the gold (higher- vs lower-numbered),
      and the gold's question position (first vs second) — are assigned from a
      density-stratified, seed-shuffled balanced plan
      (dataset._temporal_factor_plan): earlier direction determines the gold's
      identity, candidate order its position, and the assignment is balanced
      within each density level so the systematic Person-ID, numeric-order,
      candidate-position and density shortcuts identified by validation are
      removed. Temporal-typed distractors alternate relation direction (~50/50);
      the shared distractor RNG and every non-temporal distractor are unchanged.
      VALIDATED 2026-09-04 on gated_deltanet (96-trial forced-answer run,
      protocol/temporal_repair_validation.md): present@128 = 15/16;
      target-removed pooled 22/48 = 0.458 (Wilson95 [0.326, 0.597], compatible
      with 0.5); paired recurrent delta = 0.00 [0, 0] -> H1 branch A. DOCUMENTED
      RESPONSE BIAS (report, do not engineer away): absent a determinative fact
      this model prefers the lower-numbered (~83%) / first-listed (~67%)
      candidate; it is counterbalanced against the gold, nets to chance, and does
      not bias the benchmark. H1 cross-type comparison uses an empirical
      target-removed null, not a 0.2 free-response chance — see open_decisions #17.

  entity-attribute:
    construct: entity attribute
    example: "Person_0's favorite color is blue."
    importance: medium
    answer_form: closed_set        # 5 colours -> 20% chance
    answer_hint: "Reply with only the colour."
    h1_prediction: fast degradation, but chance-corrected

  multi-hop:
    construct: compound relational
    example: "Person_0 manages Person_1. Person_1 works for Google."
    query: which company does Person_0's subordinate work for?
    importance: high
    answer_form: closed_set        # 5 companies
    answer_hint: "Reply with only the company name."
    h1_prediction: fastest — a two-clause query over one target
    caveat: >-
      NOT distributed multi-hop retrieval. The target is a single co-located
      two-clause sentence ("A manages B. B works for C.") that moves as one span;
      the query needs both clauses of that one target, not two facts at different
      positions. Paper-facing name: "compound relational" (report.fact_type_label).
      Do not describe Pilot Pass 2 / the full run as testing genuine multi-hop
      reasoning. See protocol/pilot_pass2.md.

  contradictory:
    construct: contradictory update
    example: "Person_0 lived in Paris. Person_0 now lives in London."
    importance: high
    answer_form: closed_set
    answer_hint: "Reply with only the name of the city where they live now."
    h1_prediction: the update should survive; the stale value is the failure mode
    caveat: >-
      The 500-row pilot scored this at 0% (a containment-scoring / constant-gold
      bug, since fixed — open_decisions.md #7). Pilot Pass 2 (2026-09-05, repaired
      scorer) supersedes that: ~93% in-window, ~35% pooled for the AHN arms —
      contradictory now behaves like the other closed-set types.

# Chance / null baselines — UNRESOLVED (open_decisions.md #17).
#
# Raw strict accuracy is the PRIMARY H1 metric. These values are NOT equivalent to
# each other and must not be pooled:
#   * temporal 0.5 is a MATHEMATICAL property of a two-alternative forced choice.
#   * the 0.2 closed-set values are PROVISIONAL and probably wrong — entity-
#     attribute / multi-hop / contradictory are free-response (the model is never
#     shown the options; collision control removes the gold from context), so the
#     true uninformed rate is unknown and likely < 0.2.
#   * numerical 0.0 — a free-response ID is essentially never guessed.
#
# `metrics.chance_corrected_accuracy` reads this block and is DEPRECATED. Prefer
# `metrics.baseline_adjusted_accuracy(df, baseline)` with an EXPLICIT,
# provenance-bearing baseline (a scalar, a {fact_type: float} map, or a per-row
# Series) — it never reads this block. Temporal 0.5, if used, must be passed
# explicitly and separately from any free-response null.
chance:
  numerical: 0.0
  temporal: 0.5             # mathematical (2AFC) — NOT comparable to the closed-set values
  entity-attribute: 0.2      # PROVISIONAL — see note above
  multi-hop: 0.2             # PROVISIONAL
  contradictory: 0.2         # PROVISIONAL

# Distractors must never contain the target's answer, or a "correct" response can
# be produced without retrieving anything. Enforced by dataset.assert_no_collision.
collision_control:
  enabled: true
  check: target answer string must not appear in any distractor text
